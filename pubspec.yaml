name: open_study_app
description: Search and study using free, openly-licensed educational materials — all viewable in-app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Networking (official public APIs only)
  http: ^1.2.0
  xml: ^6.5.0

  # In-app viewing of the provider's own pages and official embeds
  flutter_inappwebview: ^6.0.0

  # Official YouTube embedded player (Creative Commons videos only)
  youtube_player_flutter: ^9.0.3

  # Opening the original source / licence pages
  url_launcher: ^6.3.0

  # Bookmarks and recent searches, stored only on the phone
  shared_preferences: ^2.3.0

  # UI
  cupertino_icons: ^1.0.6
  cached_network_image: ^3.3.1
  google_fonts: ^6.2.1
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
